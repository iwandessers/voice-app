services:

  control-panel:
    build: ./webapp
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:latest
    ports:
      - "10200:10200"
    volumes:
      - piper-voices:/data
    command: --voice en_US-lessac-medium

  kitten-tts:
    build: ./model-servers/kitten-tts
    ports:
      - "8100:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"

  melotts:
    build: ./model-servers/melotts
    ports:
      - "8200:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface

  chatterbox:
    build: ./model-servers/chatterbox
    ports:
      - "8300:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface

  chatterbox-turbo:
    build: ./model-servers/chatterbox
    ports:
      - "8301:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface

  stable-audio-sfx:
    build: ./model-servers/stable-audio
    ports:
      - "8400:8000"
    environment:
      - MODE=sfx
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface

  stable-audio-music:
    build: ./model-servers/stable-audio
    ports:
      - "8401:8000"
    environment:
      - MODE=music
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface

  ace-step:
    build: ./model-servers/ace-step
    ports:
      - "8500:7860"
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  piper-voices:
  hf-cache:
